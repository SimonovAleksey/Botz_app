name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Collect Qt dependencies
        run: |
          mkdir dist
          copy build\Release\RobotControlApp.exe dist\
          windeployqt --release dist\RobotControlApp.exe

      - name: Zip result
        run: Compress-Archive -Path dist\* -DestinationPath RobotControlApp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RobotControlApp-windows
          path: RobotControlApp-windows.zip
